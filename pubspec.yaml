name: satto_keisan
description: "サッと計算 - 日常のちょっとした計算をサッと済ませるユーティリティアプリ"
publish_to: 'none'

version: 1.1.2+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # 日本語ロケール(漢字を日本語の字形で表示し、日付選択なども日本語にする)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_riverpod: ^2.6.1

  # 広告(AdMob)
  google_mobile_ads: ^5.2.0

  # ローカル保存(履歴・設定)
  shared_preferences: ^2.3.3

  # 日付フォーマット
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # アプリアイコン生成
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons で再生成
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2FA3F9"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
